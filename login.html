<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">

<title>Login | Arisudan Transport</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:
radial-gradient(circle at top,#173452 0,#07111f 45%,#030912 100%);
color:white;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login{
width:100%;
max-width:420px;
}

.logo{
width:78px;
height:78px;
margin:0 auto 15px;
border-radius:25px;
background:linear-gradient(145deg,#ffe66b,#ffc400);
display:flex;
align-items:center;
justify-content:center;
font-size:39px;
box-shadow:0 15px 35px rgba(255,196,0,.18);
}

.brand{
text-align:center;
margin-bottom:25px;
}

.brand h1{
font-size:27px;
color:#ffd43b;
}

.brand p{
font-size:10px;
color:#7c8da2;
margin-top:6px;
letter-spacing:1px;
}

.card{
background:rgba(14,28,45,.96);
border:1px solid rgba(255,255,255,.07);
border-radius:25px;
padding:22px;
box-shadow:0 25px 60px rgba(0,0,0,.3);
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
background:#091625;
padding:5px;
border-radius:14px;
margin-bottom:22px;
}

.tab{
border:0;
background:transparent;
color:#718096;
height:40px;
border-radius:10px;
font-size:9px;
font-weight:bold;
cursor:pointer;
}

.tab.active{
background:#ffd43b;
color:#111;
}

label{
display:block;
font-size:9px;
font-weight:bold;
color:#8795a8;
margin:13px 0 7px;
}

.input{
width:100%;
height:51px;
background:#091625;
border:1px solid rgba(255,255,255,.07);
border-radius:13px;
color:white;
padding:0 14px;
outline:none;
font-size:12px;
}

.input:focus{
border-color:#ffd43b;
box-shadow:0 0 0 3px rgba(255,212,59,.06);
}

.login-btn{
width:100%;
height:53px;
margin-top:20px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#ffe36a,#ffc400);
color:#111;
font-size:13px;
font-weight:900;
cursor:pointer;
}

.remember{
display:flex;
align-items:center;
gap:8px;
margin-top:13px;
color:#718096;
font-size:9px;
}

.remember input{
accent-color:#ffd43b;
}

.error{
display:none;
background:rgba(239,68,68,.08);
color:#fca5a5;
border-radius:11px;
padding:11px;
margin-top:12px;
text-align:center;
font-size:10px;
}

.demo{
margin-top:18px;
padding:12px;
background:#091625;
border-radius:12px;
font-size:8px;
color:#657489;
line-height:1.6;
text-align:center;
}

.demo b{
color:#ffd43b;
}

.footer{
text-align:center;
font-size:8px;
color:#536276;
margin-top:18px;
}
</style>
</head>

<body>

<div class="login">

<div class="logo">
🚛
</div>

<div class="brand">

<h1>Arisudan Trucks</h1>

<p>BOOK • TRACK • DELIVER</p>

</div>


<div class="card">

<div class="tabs">

<button
class="tab active"
id="customerTab"
onclick="selectRole('customer')">
CUSTOMER
</button>

<button
class="tab"
id="driverTab"
onclick="selectRole('driver')">
DRIVER
</button>

<button
class="tab"
id="adminTab"
onclick="selectRole('admin')">
ADMIN
</button>

</div>


<label id="mobileLabel">
MOBILE NUMBER
</label>

<input
class="input"
id="mobile"
type="tel"
inputmode="numeric"
placeholder="Enter mobile number"
autocomplete="username">


<label>
PASSWORD
</label>

<input
class="input"
id="password"
type="password"
placeholder="Enter password"
autocomplete="current-password">


<div class="remember">

<input
type="checkbox"
id="remember"
checked>

<label
for="remember"
style="margin:0;color:#718096;font-size:9px;font-weight:normal">

Remember my login

</label>

</div>


<div
id="error"
class="error">
</div>


<button
class="login-btn"
onclick="login()">

LOGIN →

</button>


<div class="demo">

Customer and Driver accounts are created by Admin.<br>

<b>No OTP • No Register page</b>

</div>

</div>


<div class="footer">
© Arisudan Transport • Secure Transport Management
</div>

</div>


<script>

let selectedRole="customer";


function selectRole(role){

selectedRole=role;


document
.querySelectorAll(".tab")
.forEach(function(tab){

tab.classList.remove("active");

});


document
.getElementById(role+"Tab")
.classList.add("active");


const mobile=
document.getElementById("mobile");


if(role==="admin"){

mobile.placeholder=
"Admin mobile number";

}else if(role==="driver"){

mobile.placeholder=
"Driver mobile number";

}else{

mobile.placeholder=
"Customer mobile number";

}

}


function showError(message){

const error=
document.getElementById("error");

error.textContent=message;

error.style.display="block";

}


function hideError(){

document.getElementById(
"error"
).style.display="none";

}


function saveSession(user){

const session={
id:user.id,
name:user.name,
mobile:user.mobile,
role:user.role,
loginTime:new Date().toISOString()
};


if(
document.getElementById(
"remember"
).checked
){

localStorage.setItem(
"arisudan_session",
JSON.stringify(session)
);

sessionStorage.removeItem(
"arisudan_session"
);

}else{

sessionStorage.setItem(
"arisudan_session",
JSON.stringify(session)
);

localStorage.removeItem(
"arisudan_session"
);

}

}


function login(){

hideError();


const mobile=
document.getElementById(
"mobile"
).value.trim();


const password=
document.getElementById(
"password"
).value;


if(!mobile){

showError(
"Please enter your mobile number."
);

return;

}


if(!password){

showError(
"Please enter your password."
);

return;

}


/*
ADMIN ACCOUNT
*/

if(selectedRole==="admin"){

if(
mobile==="9999999999" &&
password==="admin123"
){

const admin={

id:"ADMIN001",

name:"Arisudan Admin",

mobile:mobile,

password:password,

role:"admin"

};


saveSession(admin);

window.location.href=
"admin.html";

return;

}

showError(
"Incorrect admin mobile or password."
);

return;

}


/*
CUSTOMER / DRIVER ACCOUNTS
*/

const users=
JSON.parse(
localStorage.getItem(
"arisudan_users"
)
) || [];


const user=
users.find(function(item){

return String(item.mobile)===
String(mobile) &&

item.password===password &&

item.role===selectedRole;

});


if(!user){

showError(
"Invalid mobile number or password."
);

return;

}


saveSession(user);


if(selectedRole==="driver"){

window.location.href=
"driver.html";

}else{

window.location.href=
"dashboard.html";

}

}


document
.getElementById("password")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){
login();
}

});


/*
If already logged in,
open the correct dashboard.
*/

(function(){

const data=
localStorage.getItem(
"arisudan_session"
) ||
sessionStorage.getItem(
"arisudan_session"
);

if(!data)return;

try{

const session=
JSON.parse(data);

if(session.role==="admin"){

window.location.href=
"admin.html";

}else if(session.role==="driver"){

window.location.href=
"driver.html";

}else if(session.role==="customer"){

window.location.href=
"dashboard.html";

}

}catch(e){}

})();

</script>

</body>
</html>
