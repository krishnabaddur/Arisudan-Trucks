<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">

<title>Login | Arisudan Transport</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 20% 10%,rgba(255,212,59,.12),transparent 30%),
linear-gradient(145deg,#07111f,#0b1727);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.app{
width:100%;
max-width:420px;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo-box{
width:75px;
height:75px;
margin:auto;
border-radius:25px;
background:linear-gradient(145deg,#ffe36a,#ffc400);
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
box-shadow:0 18px 45px rgba(255,196,0,.15);
}

.logo h1{
font-size:25px;
margin-top:13px;
}

.logo p{
color:#77869a;
font-size:11px;
margin-top:5px;
}

.card{
background:rgba(14,28,45,.96);
border:1px solid rgba(255,255,255,.07);
border-radius:25px;
padding:22px;
box-shadow:0 25px 60px rgba(0,0,0,.3);
}

.card-title{
margin-bottom:20px;
}

.card-title h2{
font-size:21px;
}

.card-title p{
color:#748298;
font-size:11px;
margin-top:6px;
}

.role-box{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:18px;
}

.role{
height:45px;
border-radius:12px;
border:1px solid rgba(255,255,255,.07);
background:#091625;
color:#8290a3;
font-weight:bold;
font-size:11px;
cursor:pointer;
}

.role.active{
background:#ffd43b;
color:#111;
border-color:#ffd43b;
}

.field{
margin-bottom:15px;
}

label{
display:block;
color:#8997aa;
font-size:9px;
font-weight:bold;
margin-bottom:7px;
}

.input-wrap{
position:relative;
}

.input-icon{
position:absolute;
left:13px;
top:50%;
transform:translateY(-50%);
font-size:16px;
}

input{
width:100%;
height:52px;
border-radius:13px;
border:1px solid rgba(255,255,255,.07);
background:#091625;
color:white;
padding:0 42px 0 40px;
outline:none;
font-size:13px;
}

input:focus{
border-color:#ffd43b;
box-shadow:0 0 0 3px rgba(255,212,59,.06);
}

.password-btn{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:none;
border:0;
color:#7e8da0;
font-size:17px;
cursor:pointer;
}

.login-btn{
width:100%;
height:53px;
margin-top:5px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#ffe36a,#ffc400);
color:#111;
font-size:14px;
font-weight:900;
cursor:pointer;
}

.login-btn:active{
transform:scale(.98);
}

.message{
display:none;
padding:12px;
border-radius:12px;
margin-bottom:14px;
font-size:11px;
text-align:center;
}

.message.error{
display:block;
background:rgba(239,68,68,.08);
color:#fca5a5;
}

.message.success{
display:block;
background:rgba(34,197,94,.08);
color:#86efac;
}

.demo{
margin-top:15px;
padding:12px;
border-radius:13px;
background:#091625;
color:#69788b;
font-size:9px;
line-height:1.5;
text-align:center;
}

.footer{
text-align:center;
color:#526175;
font-size:9px;
margin-top:17px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">

<div class="logo-box">
🚛
</div>

<h1>Arisudan Trucks</h1>

<p>Book • Track • Deliver</p>

</div>


<div class="card">

<div class="card-title">

<h2>Welcome Back 👋</h2>

<p>Login to manage your transport trips.</p>

</div>


<div class="role-box">

<button
class="role active"
id="customerRole"
onclick="selectRole('customer')">

👤 Customer

</button>

<button
class="role"
id="driverRole"
onclick="selectRole('driver')">

🚚 Driver

</button>

</div>


<div id="message" class="message"></div>


<div class="field">

<label>MOBILE NUMBER</label>

<div class="input-wrap">

<span class="input-icon">📱</span>

<input
id="mobile"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="Enter 10 digit mobile number">

</div>

</div>


<div class="field">

<label>PASSWORD</label>

<div class="input-wrap">

<span class="input-icon">🔐</span>

<input
id="password"
type="password"
placeholder="Enter your password">

<button
class="password-btn"
onclick="togglePassword()"
type="button">

👁️

</button>

</div>

</div>


<button
class="login-btn"
onclick="login()">

LOGIN TO ACCOUNT →

</button>


<div class="demo">

No OTP required • Login using your registered mobile number and password.

</div>

</div>


<div class="footer">
Arisudan Transport • Secure Account
</div>

</div>


<script>

let selectedRole="customer";


function selectRole(role){

selectedRole=role;


document
.getElementById("customerRole")
.classList.remove("active");

document
.getElementById("driverRole")
.classList.remove("active");


if(role==="customer"){

document
.getElementById("customerRole")
.classList.add("active");

}
else{

document
.getElementById("driverRole")
.classList.add("active");

}

}


function togglePassword(){

const password=
document.getElementById("password");


if(password.type==="password"){

password.type="text";

}
else{

password.type="password";

}

}


function showMessage(text,type){

const message=
document.getElementById("message");

message.textContent=text;

message.className=
"message "+type;

}


function login(){

const mobile=
document.getElementById("mobile")
.value.trim();

const password=
document.getElementById("password")
.value;


if(!/^[0-9]{10}$/.test(mobile)){

showMessage(
"Enter a valid 10 digit mobile number.",
"error"
);

return;

}


if(password.length<1){

showMessage(
"Enter your password.",
"error"
);

return;

}


/*
Get registered users.
*/

const users=
JSON.parse(
localStorage.getItem("arisudan_users")
) || [];


/*
Find matching account.
*/

const user=
users.find(function(item){

return (
String(item.mobile)===String(mobile) &&
item.password===password &&
(item.role || "customer")===selectedRole
);

});


if(!user){

showMessage(
"Incorrect mobile number, password or account type.",
"error"
);

return;

}


/*
Create login session.
*/

const session={

id:user.id,

name:user.name,

mobile:user.mobile,

role:user.role || "customer",

loginTime:new Date().toISOString()

};


localStorage.setItem(
"arisudan_session",
JSON.stringify(session)
);


showMessage(
"Login successful ✓",
"success"
);


/*
Go to correct dashboard.
*/

setTimeout(function(){

if(selectedRole==="driver"){

window.location.href="driver.html";

}
else{

window.location.href="dashboard.html";

}

},500);

}

</script>

</body>
</html>
