<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Vehicle</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
}

.container{
width:90%;
max-width:420px;
margin:30px auto;
}

h2{
text-align:center;
color:#FFD700;
}

input,select{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#FFD700;
color:black;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#fare{
margin:20px 0;
font-size:22px;
text-align:center;
color:#FFD700;
}
</style>

</head>
<body>

<div class="container">

<h2>🚛 Book Vehicle</h2>

<input id="pickup" type="text" placeholder="Pickup Location" required>

<input id="drop" type="text" placeholder="Drop Location" required>

<input id="distance" type="number" placeholder="Distance (KM)" required>

<select id="vehicle">
<option value="400">3 Wheeler</option>
<option value="800">Mini Truck</option>
<option value="1500">Truck 5 Ton</option>
</select>

<div id="fare">Estimated Fare ₹0</div>

<button onclick="book()">Book Now</button>

</div>

<script>

function book(){

const pickup=document.getElementById("pickup").value.trim();
const drop=document.getElementById("drop").value.trim();
const distance=Number(document.getElementById("distance").value);

if(pickup==="" || drop==="" || distance<=0){
alert("Please fill all details.");
return;
}

const vehicleSelect=document.getElementById("vehicle");
const base=Number(vehicleSelect.value);

const booking={
id:"AT"+Date.now(),
pickup:pickup,
drop:drop,
distance:distance,
vehicle:vehicleSelect.options[vehicleSelect.selectedIndex].text,
total:base+(distance*25)
};

document.getElementById("fare").innerHTML="Estimated Fare ₹"+booking.total;

let bookings=JSON.parse(localStorage.getItem("bookings")) || [];

bookings.push(booking);

localStorage.setItem("bookings",JSON.stringify(bookings));

alert("Booking Saved Successfully");

location.href="history.html";

}

</script>

</body>
</html>
