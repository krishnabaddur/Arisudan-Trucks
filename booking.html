<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">

<title>Book Vehicle | Arisudan Transport</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#07111f;
color:white;
min-height:100vh;
}

.app{
max-width:520px;
margin:auto;
min-height:100vh;
padding-bottom:35px;
}

.header{
padding:18px;
background:linear-gradient(145deg,#10253b,#07111f);
border-bottom:1px solid rgba(255,255,255,.06);
}

.header-row{
display:flex;
align-items:center;
gap:13px;
}

.back{
width:42px;
height:42px;
border-radius:13px;
background:#102033;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-decoration:none;
font-size:21px;
}

.header-icon{
width:44px;
height:44px;
border-radius:14px;
background:linear-gradient(145deg,#ffe36a,#ffc400);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.header h1{
font-size:18px;
}

.header p{
font-size:10px;
color:#77869a;
margin-top:3px;
}

.content{
padding:20px 18px;
}

.title{
margin-bottom:18px;
}

.title small{
color:#ffd43b;
font-size:9px;
font-weight:bold;
}

.title h2{
font-size:24px;
margin-top:5px;
}

.title p{
font-size:11px;
color:#77869a;
margin-top:6px;
}

.card{
background:#0e1c2d;
border:1px solid rgba(255,255,255,.06);
border-radius:21px;
padding:18px;
margin-bottom:15px;
}

.card-title{
display:flex;
align-items:center;
gap:10px;
margin-bottom:17px;
}

.card-icon{
width:35px;
height:35px;
border-radius:11px;
background:rgba(255,212,59,.1);
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
}

.card-title h3{
font-size:14px;
}

.field{
margin-bottom:14px;
}

label{
display:block;
color:#8997aa;
font-size:9px;
font-weight:bold;
margin-bottom:7px;
}

.input-wrap{
position:relative;
}

.input-icon{
position:absolute;
left:13px;
top:50%;
transform:translateY(-50%);
font-size:16px;
}

input,select{
width:100%;
height:51px;
border-radius:13px;
border:1px solid rgba(255,255,255,.07);
background:#091625;
color:white;
padding:0 13px 0 40px;
outline:none;
font-size:12px;
}

select{
padding-left:40px;
}

input:focus,
select:focus{
border-color:#ffd43b;
box-shadow:0 0 0 3px rgba(255,212,59,.06);
}

.vehicle-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.vehicle{
position:relative;
}

.vehicle input{
position:absolute;
opacity:0;
pointer-events:none;
}

.vehicle label{
height:105px;
border:1px solid rgba(255,255,255,.07);
border-radius:15px;
background:#091625;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
margin:0;
}

.vehicle label .vehicle-icon{
font-size:28px;
margin-bottom:7px;
}

.vehicle label strong{
font-size:10px;
color:#fff;
}

.vehicle label span{
font-size:8px;
color:#68778a;
margin-top:4px;
}

.vehicle input:checked + label{
border-color:#ffd43b;
background:rgba(255,212,59,.08);
}

.vehicle input:checked + label strong{
color:#ffd43b;
}

.fare{
background:linear-gradient(135deg,#172c43,#0b1929);
border:1px solid rgba(255,212,59,.13);
border-radius:18px;
padding:17px;
margin-bottom:15px;
text-align:center;
}

.fare-label{
font-size:9px;
color:#78869a;
}

.fare-price{
font-size:29px;
font-weight:900;
color:#ffd43b;
margin-top:5px;
}

.fare-note{
font-size:8px;
color:#657489;
margin-top:5px;
}

.book-btn{
width:100%;
height:55px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,#ffe36a,#ffc400);
color:#111;
font-size:14px;
font-weight:900;
cursor:pointer;
}

.book-btn:active{
transform:scale(.98);
}

.message{
display:none;
padding:12px;
border-radius:12px;
margin-bottom:14px;
font-size:11px;
text-align:center;
}

.message.error{
display:block;
background:rgba(239,68,68,.08);
color:#fca5a5;
}

.message.success{
display:block;
background:rgba(34,197,94,.08);
color:#86efac;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="header-row">

<a class="back" href="dashboard.html">
←
</a>

<div class="header-icon">
🚚
</div>

<div>
<h1>Book Vehicle</h1>
<p>Arisudan Transport</p>
</div>

</div>

</header>


<main class="content">

<div class="title">

<small>FAST • SIMPLE • RELIABLE</small>

<h2>Plan Your Trip 🚛</h2>

<p>
Enter your pickup and delivery details.
</p>

</div>


<div id="message" class="message"></div>


<!-- ROUTE -->

<div class="card">

<div class="card-title">

<div class="card-icon">
📍
</div>

<h3>Trip Details</h3>

</div>


<div class="field">

<label>PICKUP LOCATION</label>

<div class="input-wrap">

<span class="input-icon">🟢</span>

<input
id="pickup"
type="text"
placeholder="Where should we collect goods?">

</div>

</div>


<div class="field">

<label>DROP LOCATION</label>

<div class="input-wrap">

<span class="input-icon">🔴</span>

<input
id="drop"
type="text"
placeholder="Where should we deliver?">

</div>

</div>


<div class="field">

<label>DISTANCE</label>

<div class="input-wrap">

<span class="input-icon">📏</span>

<input
id="distance"
type="number"
min="1"
placeholder="Distance in KM"
oninput="calculateFare()">

</div>

</div>

</div>


<!-- VEHICLE -->

<div class="card">

<div class="card-title">

<div class="card-icon">
🚛
</div>

<h3>Select Vehicle</h3>

</div>


<div class="vehicle-grid">


<div class="vehicle">

<input
type="radio"
name="vehicle"
id="vehicle1"
value="3 Wheeler"
data-base="400"
checked
onchange="calculateFare()">

<label for="vehicle1">

<div class="vehicle-icon">
🛺
</div>

<strong>3 Wheeler</strong>

<span>Light goods</span>

</label>

</div>


<div class="vehicle">

<input
type="radio"
name="vehicle"
id="vehicle2"
value="Mini Truck"
data-base="800"
onchange="calculateFare()">

<label for="vehicle2">

<div class="vehicle-icon">
🚚
</div>

<strong>Mini Truck</strong>

<span>Medium goods</span>

</label>

</div>


<div class="vehicle">

<input
type="radio"
name="vehicle"
id="vehicle3"
value="Truck 5 Ton"
data-base="1500"
onchange="calculateFare()">

<label for="vehicle3">

<div class="vehicle-icon">
🚛
</div>

<strong>Truck 5 Ton</strong>

<span>Heavy goods</span>

</label>

</div>


<div class="vehicle">

<input
type="radio"
name="vehicle"
id="vehicle4"
value="Super Carry CNG"
data-base="1000"
onchange="calculateFare()">

<label for="vehicle4">

<div class="vehicle-icon">
🚚
</div>

<strong>Super Carry CNG</strong>

<span>Goods carrier</span>

</label>

</div>

</div>

</div>


<!-- FARE -->

<div class="fare">

<div class="fare-label">
ESTIMATED FARE
</div>

<div
class="fare-price"
id="fare">

₹0

</div>

<div class="fare-note">
Base fare + ₹25 per kilometre
</div>

</div>


<button
class="book-btn"
onclick="bookVehicle()">

🚚 CONFIRM BOOKING →

</button>

</main>

</div>


<script>

function getSession(){

let data =
localStorage.getItem(
"arisudan_session"
);

if(!data){

data =
sessionStorage.getItem(
"arisudan_session"
);

}

if(!data){
return null;
}

try{
return JSON.parse(data);
}
catch(e){
return null;
}

}


function calculateFare(){

const selected =
document.querySelector(
'input[name="vehicle"]:checked'
);

if(!selected){
return 0;
}

const base =
Number(
selected.dataset.base
);

const distance =
Number(
document.getElementById(
"distance"
).value
) || 0;

const total =
base + (distance * 25);


document.getElementById(
"fare"
).textContent =
"₹" +
total.toLocaleString(
"en-IN"
);

return total;

}


function showMessage(
text,
type
){

const message =
document.getElementById(
"message"
);

message.textContent=text;

message.className =
"message " + type;

}


function bookVehicle(){

const session =
getSession();


const pickup =
document.getElementById(
"pickup"
).value.trim();


const drop =
document.getElementById(
"drop"
).value.trim();


const distance =
Number(
document.getElementById(
"distance"
).value
);


const selected =
document.querySelector(
'input[name="vehicle"]:checked'
);


if(!pickup){

showMessage(
"Please enter pickup location.",
"error"
);

return;

}


if(!drop){

showMessage(
"Please enter drop location.",
"error"
);

return;

}


if(!distance || distance<=0){

showMessage(
"Please enter a valid distance.",
"error"
);

return;

}


if(!selected){

showMessage(
"Please select a vehicle.",
"error"
);

return;

}


const base =
Number(
selected.dataset.base
);


const total =
base + (distance * 25);


const now =
new Date();


const booking = {

id:
"AT" +
Date.now()
.toString()
.slice(-8),

customerName:
session?.name || "Customer",

customerMobile:
session?.mobile || "",

pickup:pickup,

drop:drop,

distance:distance,

vehicle:selected.value,

baseFare:base,

total:total,

status:"Booked",

date:
now.toLocaleDateString(
"en-IN"
),

time:
now.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit"
}
),

createdAt:
now.toISOString()

};


let bookings =
JSON.parse(
localStorage.getItem(
"bookings"
)
) || [];


bookings.push(booking);


localStorage.setItem(
"bookings",
JSON.stringify(bookings)
);


localStorage.setItem(
"selectedBookingId",
booking.id
);


showMessage(
"Booking confirmed successfully ✓",
"success"
);


setTimeout(function(){

window.location.href =
"track.html";

},700);

}


calculateFare();

</script>

</body>
</html>
